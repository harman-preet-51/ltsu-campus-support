
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | LTSUCare</title>

    <link rel="stylesheet" href="super-admin.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f6f9;
            font-family: Arial, sans-serif;
        }

        .reset-container {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .reset-container h2 {
            margin-top: 0;
            text-align: center;
            color: #183b35;
        }

        .reset-container p {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .reset-container label {
            display: block;
            margin: 18px 0 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .reset-container input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .reset-container button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #168c79;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #reset-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="reset-container">

        <h2>Reset Your Password</h2>

        <p>
            Enter your new password below to recover your
            LTSUCare Super Admin account.
        </p>

        <form id="reset-form">

            <label for="new-password">New Password</label>
            <input
                type="password"
                id="new-password"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <button type="submit" id="reset-button">
                Update Password
            </button>

        </form>

        <div id="reset-message" role="status"></div>

    </div>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Existing Supabase Configuration -->
    <script src="../student/supabase-config.js"></script>

    <!-- Separate Reset Password JavaScript -->
    <script src="reset-password.js"></script>

</body>
</html>
