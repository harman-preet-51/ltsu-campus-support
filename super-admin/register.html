
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Registration | LTSUCare</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      padding: 20px;
    }

    .register-card {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #173b67;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #173b67;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #register-message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .notice {
      margin-top: 15px;
      padding: 11px;
      border-radius: 7px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="register-card">
    <h1>Super Admin Registration</h1>
    <p class="subtitle">LTSUCare Campus Support Portal</p>

    <form id="super-admin-register-form">

      <label for="register-name">Full Name</label>
      <input
        type="text"
        id="register-name"
        placeholder="Enter your full name"
        required
        maxlength="100"
      >

      <label for="register-email">Email Address</label>
      <input
        type="email"
        id="register-email"
        placeholder="Enter your email"
        required
      >

      <label for="register-phone">Phone Number</label>
      <input
        type="tel"
        id="register-phone"
        placeholder="Enter your phone number"
        required
        maxlength="20"
      >

      <label for="register-password">Create Password</label>
      <input
        type="password"
        id="register-password"
        placeholder="Minimum 8 characters"
        required
        minlength="8"
      >

      <label for="register-confirm-password">Confirm Password</label>
      <input
        type="password"
        id="register-confirm-password"
        placeholder="Enter password again"
        required
      >

      <button type="submit" id="register-button">
        Submit Registration
      </button>

      <div id="register-message" role="status"></div>
    </form>

    <div class="notice">
      Your registration will be reviewed by an existing Super Admin.
      You can access the Super Admin dashboard only after approval.
      No email or OTP will be sent.
    </div>

    <a class="back-link" href="super-admin.html">
      Back to Super Admin Login
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../student/supabase-config.js"></script>
  <script src="register.js"></script>

</body>
</html>
